[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility-data-platform"
version = "0.1.0"
description = "Batch data platform for NYC taxi and weather analytics."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "integration: hits live external endpoints (deselect with '-m not integration')",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportMissingParameterType = false
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["nyc_mobility"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
