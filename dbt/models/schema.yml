version: 2

models:
  - name: stg_weather
    columns:
      - name: time
        tests:
          - not_null
          - unique
      - name: temperature_2m
        tests:
          - not_null
  - name: stg_taxi_trips
    columns:
      - name: pickup_datetime
        tests:
          - not_null
      - name: dropoff_datetime
        tests:
          - not_null
      - name: pickup_location_id
        tests:
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
  - name: dim_zone
    columns:
      - name: location_id
        tests:
        - unique
        - not_null
